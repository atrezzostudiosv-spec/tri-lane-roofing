name: Temporary Gallery source-preserving media variants
on:
  push:
    branches: [optimize-gallery-mobile-20261022]
permissions:
  contents: write
jobs:
  generate-gallery-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet pillow
      - name: Create high-quality smaller copies of existing Gallery images
        run: |
          python3 - <<'PY'
          from PIL import Image,ImageChops,ImageStat
          from pathlib import Path
          import math,os
          folder=Path('assets/images')
          files=[
            ('home-intro.webp','gallery-hero',{480:95,800:95}),
            ('home-gallery-feature.jpg','gallery-feature',{480:96,900:96}),
            ('gallery-concept-02.webp','gallery-concept-02-thumb',{480:96,900:96}),
            ('gallery-concept-03.webp','gallery-concept-03-thumb',{480:96,900:96}),
            ('home-gallery-secondary.jpg','gallery-secondary',{480:96,900:96}),
            ('home-gallery-detail.jpg','gallery-detail',{480:96,900:96}),
            ('gallery-concept-06.webp','gallery-concept-06-thumb',{480:96,900:96}),
            ('gallery-concept-07.webp','gallery-concept-07-thumb',{480:96,900:96})
          ]
          total_before=total_after=0
          for original,name,widths in files:
            im=Image.open(folder/original).convert('RGB')
            print('SOURCE',original, im.size,'bytes',os.path.getsize(folder/original),flush=True)
            for width,q in widths.items():
              height=round(im.height*width/im.width)
              resized=im.resize((width,height),Image.Resampling.LANCZOS)
              path=folder/(name+'-'+str(width)+'.webp')
              resized.save(path,'WEBP',quality=q,method=6)
              img=Image.open(path).convert('RGB')
              assert img.size==resized.size
              err=ImageStat.Stat(ImageChops.difference(img,resized)).rms
              mse=sum(c*c for c in err)/3
              psnr=10*math.log10(255*255/mse) if mse else 100
              assert psnr>=33.0, f'Compression too visible {path} PSNR {psnr:.2f}'
              print('VARIANT',path,'size',img.size,'bytes',os.path.getsize(path),'PSNR',round(psnr,2),flush=True)
              total_before+=os.path.getsize(folder/original)
              total_after+=os.path.getsize(path)
          print('VARIANTS GENERATED',len(files)*2,'SUM RAW VARIANTS BYTES',total_after,flush=True)
          PY
      - name: Commit asset-only generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/gallery-*.webp
          git commit -m "Generate quality-checked Gallery image size variants from current sources"
          git push origin HEAD:optimize-gallery-mobile-20261022
