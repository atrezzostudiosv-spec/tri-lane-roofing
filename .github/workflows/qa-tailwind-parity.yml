name: Compare captured Tailwind CSS visually

on:
  push:
    branches: [optimization-tailwind-static-runtime-20261022]

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install minimal controller (preinstalled Chrome)
        run: npm install --no-save playwright@1.56.1 pngjs@7.0.0
      - name: Verify 20 viewport comparisons against deployed source branch
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add --detach /tmp/tri-lane-before-static-css origin/main
          python3 -m http.server 8765 --bind 127.0.0.1 --directory /tmp/tri-lane-before-static-css >/tmp/css-before.log 2>&1 &
          python3 -m http.server 8766 --bind 127.0.0.1 --directory . >/tmp/css-after.log 2>&1 &
          sleep 3
          node qa/check-tailwind-parity.mjs
