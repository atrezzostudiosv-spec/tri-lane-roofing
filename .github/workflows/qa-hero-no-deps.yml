name: Lightweight hero parity check

on:
  push:
    branches: [optimization-hero-priority-20261022]

permissions:
  contents: read

jobs:
  chrome-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare original against candidate with preinstalled Chrome
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add --detach /tmp/tri-lane-baseline origin/main
          python3 -m http.server 8765 --bind 127.0.0.1 --directory /tmp/tri-lane-baseline >/tmp/base-hero.log 2>&1 &
          python3 -m http.server 8766 --bind 127.0.0.1 --directory . >/tmp/candidate-hero.log 2>&1 &
          sleep 2
          python3 - <<'PY'
          import os, subprocess, shutil, hashlib, pathlib
          chrome = shutil.which('google-chrome') or shutil.which('google-chrome-stable') or shutil.which('chromium')
          assert chrome, 'Pre-installed Chrome not available'
          print('Using Chrome:', chrome, flush=True)
          tested = 0
          for file in ['index.html', 'about.html', 'services.html', 'gallery.html']:
              for width in [375, 768, 1024, 1440]:
                  checksums = []
                  for port in [8765, 8766]:
                      screenshot = f'/tmp/hero-{port}-{width}.png'
                      profile = f'/tmp/hero-profile-{port}-{width}'
                      args = [chrome, '--headless', '--no-sandbox', '--disable-gpu', '--disable-dev-shm-usage', '--hide-scrollbars', '--force-device-scale-factor=1', '--disable-extensions', '--virtual-time-budget=2000', '--window-size='+str(width)+',900', '--user-data-dir='+profile, '--screenshot='+screenshot, f'http://127.0.0.1:{port}/{file}']
                      subprocess.run(args, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=45, check=True)
                      assert os.path.getsize(screenshot)>2000, screenshot
                      checksums.append(hashlib.sha256(pathlib.Path(screenshot).read_bytes()).hexdigest())
                  assert checksums[0] == checksums[1], f'Screenshot mismatch: {file} @ {width}px'
                  tested += 1
                  print(f'PASS screenshot match: {file} @ {width}px', flush=True)
          assert tested==16
          print(f'PASS all {tested} screen comparisons',flush=True)
          PY
