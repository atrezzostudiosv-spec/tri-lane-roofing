name: Reliable Chromium hero parity

on:
  push:
    branches: [optimization-hero-priority-20261022]

permissions:
  contents: read

jobs:
  chrome-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install small Playwright controller only (reuse Chrome on runner)
        run: npm install --no-save playwright@1.56.1 pngjs@7.0.0
      - name: Pixel and layout parity at 375, 768, 1024 and 1440 px
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome
          git fetch origin main
          git worktree add --detach /tmp/tri-lane-baseline origin/main
          python3 -m http.server 8765 --bind 127.0.0.1 --directory /tmp/tri-lane-baseline >/tmp/base-hero.log 2>&1 &
          python3 -m http.server 8766 --bind 127.0.0.1 --directory . >/tmp/candidate-hero.log 2>&1 &
          sleep 2
          node qa/verify-hero-playwright-localchrome.mjs
