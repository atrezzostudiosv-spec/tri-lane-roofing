name: Temporary Gallery network-priority pixel parity
on:
  push:
    branches: [optimize-gallery-icon-connection-20261022]
permissions:
  contents: read
jobs:
  pixel-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm install --no-save playwright@1.56.1 pngjs@7.0.0
      - name: Assert exact visual matching on all devices including icons and fullscreen viewer
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add --detach /tmp/tl-main-site origin/main
          python3 -m http.server 8765 --directory /tmp/tl-main-site --bind 127.0.0.1 >/tmp/tl-main.log 2>&1 &
          python3 -m http.server 8766 --directory . --bind 127.0.0.1 >/tmp/tl-test.log 2>&1 &
          sleep 2
          node qa/gallery-network-visual-parity.mjs
