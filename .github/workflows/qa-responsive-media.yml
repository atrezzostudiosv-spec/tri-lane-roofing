name: Temporary responsive media visual QA

on:
  push:
    branches: [optimization-responsive-media-20261022]

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install lightweight browser automation without browser download
        run: npm install --no-save playwright@1.56.1 pngjs@7.0.0
      - name: Compare rendered Home against current main
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add --detach /tmp/tri-lane-baseline origin/main
          python3 -m http.server 8765 --bind 127.0.0.1 --directory /tmp/tri-lane-baseline >/tmp/base-media.log 2>&1 &
          python3 -m http.server 8766 --bind 127.0.0.1 --directory . >/tmp/candidate-media.log 2>&1 &
          sleep 2
          node qa/check-responsive-media.mjs
