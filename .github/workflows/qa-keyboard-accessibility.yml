name: Temporary keyboard-only fixes visual and functional parity
on:
  push:
    branches: [fix-inquiry-keyboard-accessibility-20261023]
permissions:
  contents: read
jobs:
  keyboard-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1 pngjs@7.0.0 axe-core@4.10.3
      - name: Check all five pages and four responsive sizes against approved design
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add --detach /tmp/tri-lane-keyboard-baseline origin/main
          python3 -m http.server 8765 --bind 127.0.0.1 --directory /tmp/tri-lane-keyboard-baseline >/tmp/tri-kbbase.log 2>&1 &
          python3 -m http.server 8766 --bind 127.0.0.1 --directory . >/tmp/tri-kbfix.log 2>&1 &
          sleep 3
          node qa/keyboard-accessibility-regression.mjs
