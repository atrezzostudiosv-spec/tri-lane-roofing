name: Temporary hero and Tailwind visual comparison
on:
  push:
    branches: [optimization-hero-tailwind-20261022]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare baseline and candidate worktrees
        run: |
          git worktree add --detach /tmp/trl-base origin/main
          git worktree add --detach /tmp/trl-hero origin/main
          git worktree add --detach /tmp/trl-css origin/main
      - name: Install evaluation dependencies
        run: |
          python -m pip install pillow
          mkdir -p /tmp/atrezzo-perf
          npm install --prefix /tmp/atrezzo-perf --no-fund --no-audit tailwindcss@3.4.17 playwright@1.56.1 pngjs@7
          /tmp/atrezzo-perf/node_modules/.bin/playwright install --with-deps chromium
      - name: Prepare pixel-identical hero WebP previews
        run: |
          python - <<'PY'
          from PIL import Image,ImageChops
          import os
          base='/tmp/trl-hero'
          images={'home-hero.png':(1672,941),'home-intro.png':(1122,1402)}
          for name,dimensions in images.items():
              img=Image.open(base+'/assets/images/'+name)
              assert img.size==dimensions and img.mode=='RGB',(name,img.size,img.mode)
              destination=base+'/assets/images/'+name.replace('.png','.webp')
              img.save(destination,format='WEBP',lossless=True,method=6)
              converted=Image.open(destination)
              assert ImageChops.difference(img,converted).getbbox() is None, name
              print('LOSSLESS HERO',name,os.path.getsize(base+'/assets/images/'+name),os.path.getsize(destination),'pixels identical')
          for page in ['index.html','about.html','services.html','gallery.html','contact.html']:
              p=base+'/'+page
              s=open(p).read()
              s=s.replace('assets/images/home-hero.png','assets/images/home-hero.webp')
              s=s.replace('assets/images/home-intro.png','assets/images/home-intro.webp')
              open(p,'w').write(s)
          PY
      - name: Prepare compiled Tailwind preview with original classes
        run: |
          cd /tmp/trl-css
          cat > tailwind.atrezzo.config.cjs <<'JS'
          module.exports = {content:['./*.html','./assets/js/**/*.js'],theme:{extend:{
              colors:{brand:{orange:'#F58620',charcoal:'#171B1E',slate:'#344047',stone:'#F4F1EB',lightStone:'#FAF8F5'}},
              fontFamily:{display:['"Barlow Condensed"','sans-serif'],body:['"Manrope"','sans-serif']}
          }}};
          JS
          printf '@tailwind base;\n@tailwind components;\n@tailwind utilities;\n' >/tmp/atrezzo-perf/source.css
          /tmp/atrezzo-perf/node_modules/.bin/tailwindcss -c tailwind.atrezzo.config.cjs -i /tmp/atrezzo-perf/source.css -o assets/css/tailwind-static-candidate.css --minify
          python - <<'PY'
          import re
          for name in ('index.html','about.html','services.html','gallery.html','contact.html'):
              source=open(name,encoding='utf-8').read()
              first='<script src="https://cdn.tailwindcss.com"></script>'
              assert source.count(first)==1
              source=source.replace(first,'<link rel="stylesheet" href="assets/css/tailwind-static-candidate.css"/>')
              expr=r'<script>\s*tailwind\.config\s*=\s*\{[\s\S]*?\}\s*</script>'
              source,count=re.subn(expr,'',source,count=1)
              assert count==1,(name,count)
              open(name,'w',encoding='utf-8').write(source)
          PY
          wc -c assets/css/tailwind-static-candidate.css
      - name: Start preview servers
        run: |
          nohup python -m http.server 8851 --bind 127.0.0.1 --directory /tmp/trl-base >/tmp/trl-base.log 2>&1 &
          nohup python -m http.server 8852 --bind 127.0.0.1 --directory /tmp/trl-hero >/tmp/trl-hero.log 2>&1 &
          nohup python -m http.server 8853 --bind 127.0.0.1 --directory /tmp/trl-css >/tmp/trl-css.log 2>&1 &
          sleep 2
          for port in 8851 8852 8853; do curl --fail -s -o /dev/null http://127.0.0.1:$port/index.html; done
      - name: Compare all five pages at four viewports
        run: node qa/performance-compare.cjs
      - name: Upload render regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atrezzo-performance-visual-review
          path: /tmp/atrezzo-perf-report
          if-no-files-found: warn
          retention-days: 3
