name: Temporary WCAG contrast audit

on:
  push:
    branches: [audit-contrast-fixes-20261022]

permissions:
  contents: read
jobs:
  axe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1 @axe-core/playwright@4.10.2
      - name: Verify contrast violations are eliminated on both screen sizes
        run: |
          python3 -m http.server 8766 --bind 127.0.0.1 --directory . >/tmp/contrast-audit.log 2>&1 &
          sleep 2
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import AxeBuilder from '@axe-core/playwright';
          const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});
          let failed=0;
          try{
            for(const file of ['about.html','services.html','contact.html'])for(const width of [375,1440]){
              const page=await browser.newPage({viewport:{width,height:900},reducedMotion:'reduce'});
              try{
                await page.goto('http://127.0.0.1:8766/'+file,{waitUntil:'load',timeout:60000});
                await page.evaluate(()=>document.fonts.ready);
                const results=await new AxeBuilder({page}).withTags(['wcag2a','wcag2aa','wcag21a','wcag21aa','wcag22aa']).analyze();
                const violations=results.violations.map(x=>({id:x.id,impact:x.impact,nodes:x.nodes.map(n=>({target:n.target,summary:n.failureSummary})).slice(0,15)}));
                console.log('AXE '+file+' '+width+' '+JSON.stringify(violations));
                if(violations.length)failed++;
                const size=await page.evaluate(()=>({doc:document.documentElement.scrollWidth,inner:innerWidth}));
                if(size.doc>size.inner)throw Error('Horizontal overflow '+file+' '+width);
              }finally{await page.close();}
            }
          }finally{await browser.close();}
          if(failed)throw Error(failed+' viewports with remaining axe violations');
          console.log('PASS 6/6 WCAG automated scans with zero violations');
          JS
