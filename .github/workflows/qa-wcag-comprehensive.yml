name: Temporary comprehensive accessibility regression
on:
  push:
    branches: [audit-contrast-fixes-20261022]
permissions:
  contents: read
jobs:
  accessibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1 @axe-core/playwright@4.10.2
      - name: Test 5 pages and wizard steps at mobile, tablet and desktop
        run: |
          python3 -m http.server 8766 --bind 127.0.0.1 --directory . >/tmp/tl-wcag.log 2>&1 &
          sleep 2
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import AxeBuilder from '@axe-core/playwright';
          const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});
          const pages=['index.html','about.html','services.html','gallery.html','contact.html'];
          let scans=0,failures=[];
          const scan=async(page,name)=>{
            await page.evaluate(()=>document.fonts.ready);
            const res=await new AxeBuilder({page}).withTags(['wcag2a','wcag2aa','wcag21a','wcag21aa','wcag22aa']).analyze();
            const v=res.violations.map(x=>({id:x.id,impact:x.impact,nodes:x.nodes.slice(0,12).map(n=>({target:n.target,summary:n.failureSummary}))}));
            console.log('WCAG RESULT '+name+' '+JSON.stringify(v));
            if(v.length)failures.push({name,violations:v});
            scans++;
          };
          try{
            for(const file of pages)for(const width of [375,768,1024,1440]){
              const context=await browser.newContext({viewport:{width,height:900},reducedMotion:'reduce'});
              try{
                const page=await context.newPage();
                const response=await page.goto('http://127.0.0.1:8766/'+file,{waitUntil:'load',timeout:60000});
                if(response?.status()!==200)throw Error('HTTP '+file);
                const dims=await page.evaluate(()=>({sw:document.documentElement.scrollWidth,vw:innerWidth}));
                if(dims.sw>dims.vw+1)failures.push({name:file+' '+width,issue:'horizontal overflow '+dims.sw});
                await scan(page,file+' '+width+' initial');
                if(width===375&&(file==='index.html'||file==='contact.html')){
                  await page.evaluate(()=>openInquiryModal());
                  await scan(page,file+' '+width+' wizard-1');
                  await page.evaluate(()=>selectWizardService('Roofing'));
                  await scan(page,file+' '+width+' wizard-2');
                  await page.evaluate(()=>wizardNext());
                  await scan(page,file+' '+width+' wizard-3');
                  await page.locator('#wiz-city').fill('Test city');
                  await page.locator('#wiz-zip').fill('00000');
                  await page.evaluate(()=>wizardNext());
                  await scan(page,file+' '+width+' wizard-4');
                }
                if(width===375&&file==='gallery.html'){
                   await page.locator('#at-gallery-redesign .at-gallery-tile').first().click();
                   await scan(page,file+' '+width+' viewer');
                   await page.keyboard.press('Escape');
                   if(!(await page.locator('#at-gallery-viewer').evaluate(x=>x.hidden)))failures.push({name:'Gallery Escape close'});
                }
              }finally{await context.close();}
            }
          }finally{await browser.close();}
          console.log('WCAG SUMMARY '+JSON.stringify({scans,violations:failures.length,failures}));
          if(failures.length)process.exitCode=1;
          JS
