name: Temporary testimonial integrity and layout QA

on:
  push:
    branches: [audit-content-fidelity-20261022]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - name: Verify exact words, testimonial attribution and responsive quote layout
        run: |
          python3 -m http.server 8766 --bind 127.0.0.1 --directory . >/tmp/quoteqa.log 2>&1 &
          sleep 2
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const tests=[
            ['index.html','Tri-Lane was professional, courteous, and on time from start to finish. They made the entire roofing process stress-free and delivered exactly what they promised.','JESSICA M.'],
            ['services.html','I’m a custom home builder and only work with contractors I can trust. Tri-Lane always delivers top-tier workmanship and communicates every step of the way.','MATT D.']
          ];
          const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});
          let count=0;
          try{
            for(const [file,expected,attribution] of tests)for(const width of [375,768,1024,1440]){
              const page=await browser.newPage({viewport:{width,height:900},reducedMotion:'reduce'});
              try{
                await page.goto('http://127.0.0.1:8766/'+file,{waitUntil:'load'});
                await page.evaluate(()=>document.fonts.ready);
                const el=page.locator('blockquote').first();
                const quote=(await el.innerText()).trim().replace(/^"|"$/g,'');
                if(quote!==expected)throw Error(file+' quote is not literal: '+quote);
                const parentText=await el.locator('xpath=..').innerText();
                if(!parentText.includes(attribution))throw Error('Attribution missing '+file);
                const dims=await page.evaluate(()=>({scrollWidth:document.documentElement.scrollWidth,viewportWidth:innerWidth}));
                if(dims.scrollWidth>dims.viewportWidth)throw Error('Horizontal overflow '+file+' '+width);
                const b=await el.boundingBox();
                if(!b || b.height<20 || b.width<150)throw Error('Quote visibility failure '+file+' '+width);
                console.log('PASS verified quote '+file+' @'+width+'px');
                count++;
              }finally{await page.close();}
            }
          }finally{await browser.close();}
          console.log('SUCCESS '+count+'/8 quote integrity/layout checks');
          JS
