name: Temporary hero priority visual regression

on:
  push:
    branches:
      - optimization-hero-priority-20261022

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout comparison branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install temporary browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Compare screenshot parity and hero fetch priority
        run: |
          git fetch origin main
          git worktree add --detach /tmp/tri-lane-base origin/main
          python3 -m http.server 8765 --bind 127.0.0.1 --directory /tmp/tri-lane-base >/tmp/tri-lane-base.log 2>&1 &
          python3 -m http.server 8766 --bind 127.0.0.1 --directory . >/tmp/tri-lane-branch.log 2>&1 &
          sleep 3
          node qa/verify-hero-priority.mjs
