name: Temporary hero and CSS inspection
on:
  push:
    branches: [optimization-hero-tailwind-20261022]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install evaluation tools
        run: |
          python -m pip install pillow
          mkdir -p /tmp/atrezzocss
          npm install --prefix /tmp/atrezzocss --no-audit --no-fund tailwindcss@3.4.17
      - name: Measure hero files and recompression candidates
        run: |
          python - <<'PY'
          import io,os,math
          from PIL import Image,ImageChops,ImageStat
          for name in ('home-hero.png','home-intro.png'):
              p='assets/images/'+name
              original=Image.open(p).convert('RGB')
              print('ORIGINAL',name,os.path.getsize(p),'dimensions',original.size, 'mode',Image.open(p).mode)
              for quality in ('lossless',95,92,90):
                  out=io.BytesIO()
                  original.save(out,format='WEBP',lossless=quality=='lossless',quality=95 if quality=='lossless' else quality,method=6)
                  data=out.getvalue()
                  dec=Image.open(io.BytesIO(data)).convert('RGB')
                  dif=ImageChops.difference(original,dec)
                  mean=sum(ImageStat.Stat(dif).mean)/3
                  same=dif.getbbox() is None
                  mse=sum(v*v*c for h in dif.histogram()[0:3] for v,c in []) if False else 0
                  print('WEBP_CANDIDATE',name,'quality',quality,'bytes',len(data),'reduction_pct',round(100*(1-len(data)/os.path.getsize(p)),1),'mean_pixel_error',round(mean,3),'exact_pixels',same)
          PY
      - name: Build candidate Tailwind 3 stylesheet for audit
        run: |
          cat > tailwind.atrezzo.config.cjs <<'JS'
          module.exports = {
            content: ['./*.html','./assets/js/**/*.js'],
            theme:{extend:{
              colors:{brand:{orange:'#F58620',charcoal:'#171B1E',slate:'#344047',stone:'#F4F1EB',lightStone:'#FAF8F5'}},
              fontFamily:{display:['"Barlow Condensed"','sans-serif'],body:['"Manrope"','sans-serif']}
            }}
          };
          JS
          printf '@tailwind base;\n@tailwind components;\n@tailwind utilities;\n' >/tmp/atrezzo-tailwind-input.css
          /tmp/atrezzocss/node_modules/.bin/tailwindcss -c tailwind.atrezzo.config.cjs -i /tmp/atrezzo-tailwind-input.css -o /tmp/atrezzocss/tailwind-compiled.css --minify
          wc -c assets/css/tailwind-fallback.css /tmp/atrezzocss/tailwind-compiled.css
          grep -o 'https://cdn.tailwindcss.com' *.html | wc -l
