name: Temporary Lighthouse live site audit

on:
  push:
    branches: [audit-lighthouse-20261022]

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout performance audit branch
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm published Hero HTML matches integrated PR
        run: |
          set -euo pipefail
          URL="https://atrezzostudiosv-spec.github.io/tri-lane-roofing/index.html"
          for i in $(seq 1 24); do
            if curl -L -fsS --connect-timeout 15 --max-time 40 "$URL" -o /tmp/tri-lane-home.html &&
               grep -q 'fetchpriority="high"' /tmp/tri-lane-home.html &&
               grep -q 'rel="preload" as="image"' /tmp/tri-lane-home.html; then
              echo "Published production demo includes the approved hero preload."
              exit 0
            fi
            echo "Deployment not current, retrying check $i/24"
            sleep 10
          done
          echo "::error::Live site did not expose the merged hero HTML"
          exit 1
      - name: Install Lighthouse CLI only
        run: npm install --no-save lighthouse@12.8.2
      - name: Audit Home (mobile)
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          npx lighthouse https://atrezzostudiosv-spec.github.io/tri-lane-roofing/index.html --form-factor=mobile --only-categories=performance --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path=/tmp/tri-lane-mobile.json --quiet
      - name: Audit Home (desktop)
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          npx lighthouse https://atrezzostudiosv-spec.github.io/tri-lane-roofing/index.html --preset=desktop --only-categories=performance --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path=/tmp/tri-lane-desktop.json --quiet
      - name: Summarize measured lab metrics
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for (const screen of ['mobile','desktop']){
            const report=JSON.parse(fs.readFileSync('/tmp/tri-lane-'+screen+'.json','utf8'));
            const ids=['first-contentful-paint','largest-contentful-paint','speed-index','total-blocking-time','cumulative-layout-shift'];
            console.log('LIGHTHOUSE '+screen.toUpperCase()+': '+JSON.stringify({
              finalUrl:report.finalDisplayedUrl,
              performance:Math.round((report.categories.performance?.score??0)*100),
              metrics:Object.fromEntries(ids.map(id=>[id,report.audits[id]?.displayValue??'unavailable'])),
              opportunities: Object.values(report.audits).filter(a=>a.details?.type==='opportunity'&&a.details.overallSavingsMs>0)
                .sort((a,b)=>b.details.overallSavingsMs-a.details.overallSavingsMs).slice(0,6)
                .map(a=>({id:a.id,title:a.title,savingsMs:Math.round(a.details.overallSavingsMs)}))
            },null,2));
          }
          NODE
      - name: Upload audit JSON reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tri-lane-lighthouse-20261022
          path: /tmp/tri-lane-*.json
          if-no-files-found: ignore
