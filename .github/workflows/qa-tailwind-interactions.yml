name: Exact Tailwind dynamic interaction QA

on:
  push:
    branches: [optimization-tailwind-static-runtime-20261022]

permissions:
  contents: read

jobs:
  interactions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1 pngjs@7.0.0
      - name: Compare modal, menu, gallery and dynamic status CSS
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add --detach /tmp/tri-lane-dynamic-baseline origin/main
          python3 -m http.server 8765 --bind 127.0.0.1 --directory /tmp/tri-lane-dynamic-baseline >/tmp/static-before.log 2>&1 &
          python3 -m http.server 8766 --bind 127.0.0.1 --directory . >/tmp/static-after.log 2>&1 &
          sleep 3
          node qa/check-static-tailwind-states.mjs
