name: Temporary About Services hero visual parity

on:
  push:
    branches: [optimize-about-services-hero-20261023]

permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install repeatable browser test dependencies
        run: npm install --no-save playwright@1.56.1 pngjs@7.0.0
      - name: Compare About and Services against approved main in eight responsive views
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add --detach /tmp/tri-lane-reference origin/main
          python3 -m http.server 8765 --bind 127.0.0.1 --directory /tmp/tri-lane-reference >/tmp/approved.log 2>&1 &
          python3 -m http.server 8766 --bind 127.0.0.1 --directory . >/tmp/candidate.log 2>&1 &
          sleep 3
          node qa/interior-hero-regression.mjs
