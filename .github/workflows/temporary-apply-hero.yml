name: Temporary apply verified lossless hero files
on:
  push:
    branches: [optimization-hero-tailwind-20261022]
    paths: ['.github/workflows/temporary-apply-hero.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimization-hero-tailwind-20261022
          fetch-depth: 0
      - name: Install pixel comparison library
        run: python -m pip install pillow
      - name: Produce original-pixel WebP images and retarget HTML references
        run: |
          python - <<'PY'
          from PIL import Image,ImageChops
          from pathlib import Path
          files={'home-hero.png':(1672,941),'home-intro.png':(1122,1402)}
          for old,dims in files.items():
              src=Path('assets/images')/old
              dest=src.with_suffix('.webp')
              img=Image.open(src)
              assert img.mode=='RGB' and img.size==dims,(old,img.mode,img.size)
              img.save(dest,'WEBP',lossless=True,method=6)
              new=Image.open(dest)
              assert new.size==img.size and ImageChops.difference(img,new).getbbox() is None,'Not pixel-identical: '+old
              print('WEBP exact-pixel conversion:',str(src),'->',str(dest),dest.stat().st_size,'bytes')
          edits=0
          for name in ['index.html','about.html','services.html','gallery.html','contact.html']:
              f=Path(name);s=f.read_text(encoding='utf-8')
              updated=s.replace('assets/images/home-hero.png','assets/images/home-hero.webp').replace('assets/images/home-intro.png','assets/images/home-intro.webp')
              if updated!=s:
                  f.write_text(updated,encoding='utf-8');edits+=1
                  print('Retargeted image URLs:',name)
          assert edits==4,('Expected four modified pages, got',edits)
          for p in ['index.html','about.html','services.html','gallery.html','contact.html']:
              text=Path(p).read_text()
              assert 'assets/images/home-hero.png' not in text and 'assets/images/home-intro.png' not in text
              assert 'content="noindex, follow"' in text
          PY
      - name: Commit only approved lossless hero assets and references
        run: |
          git config user.name "atrezzo-qa[bot]"
          git config user.email "atrezzostudiosv@gmail.com"
          git add assets/images/home-hero.webp assets/images/home-intro.webp index.html about.html services.html gallery.html
          git diff --cached --stat
          git diff --cached --quiet && exit 1
          git commit -m "Add visually verified lossless WebP hero photography"
          git push origin HEAD:optimization-hero-tailwind-20261022
