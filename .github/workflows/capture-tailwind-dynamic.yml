name: Temporary capture dynamic state styles

on:
  push:
    branches: [optimization-tailwind-static-runtime-20261022]

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser controller
        run: npm install --no-save playwright@1.56.1
      - name: Re-capture original CDN stylesheet including dynamic form states
        run: |
          git fetch origin main
          git worktree add --detach /tmp/tri-lane-runtime-source origin/main
          python3 -m http.server 8765 --bind 127.0.0.1 --directory /tmp/tri-lane-runtime-source >/tmp/dynamic-tailwind.log 2>&1 &
          sleep 2
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {chromium} from 'playwright';
          const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});
          const classes=[
            'bg-white/10','text-brand-orange','text-stone-300','bg-amber-50','border-amber-300',
            'text-amber-900','text-green-900','mt-4','text-sm','mt-2','text-xs','p-3','p-4',
            'rounded','border','hidden','block','mb-2','leading-relaxed','text-stone-600',
            'group-hover:scale-105','opacity-0','group-hover:opacity-100',
            'hover:shadow-xl','transition-all','transition-opacity','group'
          ];
          try{
            for(const [html,name] of [['index.html','home'],['about.html','about'],['services.html','services'],['gallery.html','gallery'],['contact.html','contact']]){
              const page=await browser.newPage({viewport:{width:1440,height:900},reducedMotion:'reduce'});
              await page.goto('http://127.0.0.1:8765/'+html,{waitUntil:'load',timeout:45000});
              await page.evaluate(()=>document.fonts.ready);
              await page.evaluate(cs=>{
                 const n=document.createElement('div');n.id='qa-dynamic-class-safelist';n.className=cs.join(' ');
                 n.style.display='none';document.body.appendChild(n);
              },classes);
              await page.waitForFunction(()=>[...document.querySelectorAll('style')].some(el=>el.textContent.length>14000 && el.textContent.includes('.bg-amber-50') && el.textContent.includes('.text-green-900')),{timeout:15000});
              await page.waitForTimeout(600);
              const css=await page.evaluate(()=>[...document.querySelectorAll('style')].find(el=>el.textContent.length>14000 && el.textContent.includes('--tw-border-spacing-x'))?.textContent||'');
              if(!css.includes('.bg-amber-50')||!css.includes('.text-green-900')||css.length<14000)throw Error('Dynamic CSS capture failed '+html);
              fs.writeFileSync('assets/css/tailwind-runtime-'+name+'.css',css,'utf8');
              console.log('DYNAMIC CSS CAPTURED '+html+': '+css.length+' bytes, includes form error/success utilities');
              await page.close();
            }
          }finally{await browser.close();}
          JS
      - name: Commit dynamic-safe CSS to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/tailwind-runtime-*.css
          git commit -m "Include dynamically activated form and gallery utility classes in static CSS"
          git push origin HEAD:optimization-tailwind-static-runtime-20261022
